<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5fb">
<title>Lohnrechner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<div class="sheet">

  <header class="sheet__head">
    <button id="themeToggle" class="theme-toggle" aria-label="Hell-/Dunkelmodus umschalten">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <div class="head__row">
      <button id="prevMonth" class="nav" aria-label="Vorheriger Monat">‹</button>
      <div class="head__title">
        <span class="eyebrow">Lohnrechner</span>
        <span id="monthLabel" class="month">August 2026</span>
      </div>
      <button id="nextMonth" class="nav" aria-label="Nächster Monat">›</button>
    </div>
  </header>

  <section class="block">
    <div class="field">
      <label for="rate">Stundenlohn</label>
      <div class="field__input">
        <input id="rate" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
        <span class="unit">€/h</span>
      </div>
    </div>
    <div class="field">
      <label for="hours">Stunden</label>
      <div class="field__input">
        <input id="hours" type="number" inputmode="decimal" step="0.25" min="0" placeholder="0">
        <span class="unit">h</span>
      </div>
    </div>
    <div class="line line--sum">
      <span>Grundlohn</span>
      <span id="baseWage" class="tabular">0,00 €</span>
    </div>
  </section>

  <section class="block">
    <h2 class="block__title">Zusatzeinnahmen</h2>
    <ul id="extrasList" class="extras"></ul>

    <form id="extraForm" class="extra-form">
      <input id="extraLabel" type="text" placeholder="Bezeichnung, z. B. Provision" required maxlength="40">
      <input id="extraAmount" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
      <button type="submit" class="add">+</button>
    </form>
  </section>

  <section class="total">
    <div class="total__inner">
      <span class="total__label">Gesamt</span>
      <span id="totalAmount" class="total__amount tabular">0,00 €</span>
    </div>
  </section>

  <p id="offlineNote" class="offline-note" hidden>Offline — Änderungen werden lokal gespeichert.</p>

</div>

<script src="app.js"></script>
</body>
</html>
